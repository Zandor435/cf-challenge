<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Profiles — CF Challenge</title>
<meta name="description" content="Every manager in the league: persona, picks, and live standing.">
<!-- Icon: the masthead shield, adapted for a tab bar. The SVG is the real
     asset; favicon.ico is declared after it purely so the browsers that ignore
     an SVG icon request a file that exists instead of 404ing on /favicon.ico. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<!-- Self-hosted webfonts (was a fonts.googleapis.com stylesheet + two
     preconnects). Declared before style.css so the faces exist by the time the
     --display/--body/--mono tokens are read. See the header of fonts.css. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<!-- The editorial profile system. LOADED BY THIS PAGE ONLY — it carries its
     own ground, type scale and colour model (see the header of profile.css),
     and keeping it out of style.css is what guarantees the standings board,
     analytics and the SVP column cannot shift when a profile rule changes.
     Loaded after style.css so it wins on the classes it shares. -->
<link rel="stylesheet" href="profile.css">
</head>
<!-- pf-body-ground puts the warm newsprint behind the whole document rather
     than behind the content column, so the paper runs to the viewport edge and
     under any overscroll instead of stopping at a seam. -->
<body id="top" class="pf-body-ground">

<!-- GROUP-GENERIC. Nothing on this page knows about panel, or about four
     managers. It renders whatever standings.json returns for ?group=, and
     every persona field is optional — 18 of the 22 managers across the other
     leagues launch with no persona content at all and still get a real card
     off their picks and their standing. -->

<header class="svp-masthead mgr-masthead">
  <div class="svp-masthead-inner">
    <a class="svp-wordmark" href="index.html" id="brand-link">CF <span>Challenge</span></a>
    <!-- Built from PAGE_NAV in site.js so this strip cannot drift from the
         home page's. Unbuilt (kind: 'soon') tabs are omitted here rather than
         linked at nothing — this page has no COMING SOON panel to swap in. -->
    <nav class="svp-nav" id="page-nav" aria-label="Site sections"></nav>
    <span class="svp-week" id="group-label"></span>
  </div>
</header>

<!-- Sample-data banner — the same band, the same placement and the same
     standings.json field analytics.html uses, which shares this masthead. Read
     off meta.draft_status; dummy picks must never read as a real draft, least
     of all on the page that lays out every pick a manager holds. -->
<div class="sample-banner" id="sample-banner" role="alert" hidden></div>

<main class="pf-page">
  <div class="loading" id="loading">Loading&hellip;</div>

  <!-- Fatal load error: an unknown ?group=, or a missing standings.json. Same
       posture as app.js — name it and stop, never quietly serve another
       league's numbers under this URL. -->
  <section class="load-error" id="load-error" hidden></section>

  <!-- NO MASTHEAD BANNER, deliberately. This page carried the rotator that
       now runs on index.html, and it was the wrong surface for it: the
       group is already named by the masthead and again by the page title
       below, so the band added a third announcement and pushed the first
       profile under the fold. A text-heavy scroll wants its first picture to
       be a person, not decoration. data/<group>/banners.json is untouched BY
       THIS PAGE — index.html reads it every load and picks one of panel's
       fifteen banners from it. -->

  <section class="pf-intro" id="mgr-intro" hidden></section>

  <!-- Contents. Built by renderContents() in DRAFT ORDER (each manager's
       position in groups/<group>/personas.json), which is the same order the
       alternating layout is pinned to and is NOT the standings order the
       sections below are rendered in. Sits under the page title rather than
       under the site masthead: it is this page's table of contents, and
       splitting the title away from the masthead to make room for it would
       cost more than it buys. Not sticky — every profile closes with its own
       "back to top", and a bar that follows the reader down eight full-bleed
       sections is the SaaS tab strip this page is not. -->
  <nav class="pf-contents" id="mgr-contents" aria-label="Managers on this page" hidden></nav>

  <div id="mgr-list"></div>
</main>

<footer class="site-foot">
  <p>Standings are exact arithmetic off committed game results. The projection is a
     model estimate from SP+ ratings and updates weekly. Data via collegefootballdata.com.</p>
</footer>

<!-- site.js first: it defines the shared group list, URL rules and
     resolveArt() that managers.js reads by name. Order is load-bearing. -->
<script src="site.js"></script>
<script src="managers.js"></script>
</body>
</html>
