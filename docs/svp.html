<!-- STATIC PREVIEW — not wired to the commentary pipeline (still stubbed).

<header class="svp-masthead">

<main class="svp-page">

    <figcaption class="svp-cover-note">Cover art — persona pipeline</figcaption>

<script>
  // Presentation only: carry ?group= back to the board so the league selection
  // survives the round trip. No data is read here.
  (function () {
    var q = location.search;
    if (!q) return;
    document.querySelectorAll('a[href="index.html"]').forEach(function (a) {
      a.setAttribute('href', 'index.html' + q);
    });
  })();
</script>
