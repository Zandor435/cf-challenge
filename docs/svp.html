<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The SVP Column — CF Challenge</title>
<meta name="description" content="Weekly SVP column: one big thing from the week's pick'em action.">
<!-- Icon: the masthead shield, adapted for a tab bar. The SVG is the real
     asset; favicon.ico is declared after it purely so the browsers that ignore
     an SVG icon request a file that exists instead of 404ing on /favicon.ico. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<!-- Self-hosted webfonts (was a fonts.googleapis.com stylesheet + two
     preconnects). Declared before style.css so the faces exist by the time the
     --display/--body/--mono tokens are read. See the header of fonts.css. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- THE SEASON'S COLUMN ARCHIVE, AND THE MARKUP ASSERTS NOTHING IN ANY STATE.
     Archive absent (the normal state for a group that has not filed a column,
     and for every group before Week 0): the dark-desk teaser below stands,
     exactly as it did when this page had no wiring at all. Archive present:
     the newest column replaces the teaser in full, and every earlier week is
     listed under it and opens in place.

     ONE ENTRY IS NOT A SPECIAL CASE OF MANY, and neither is Week 0. A group
     with a single filed column renders that column and simply has no list
     beneath it; a preseason column is an ordinary entry that happens to be
     labelled "Preseason" instead of "Week 00". There is no separate code path
     for either, because a separate code path is where the one-column state
     drifts away from the many-column one.

     No manager, event, number or week is written into this file. Everything
     live is filled by the script at the bottom, and every fetch it makes fails
     to the absent state rather than to a guess. -->

<header class="svp-masthead">
  <div class="svp-masthead-inner">
    <a class="svp-wordmark" href="index.html">CF <span>Challenge</span></a>
    <!-- Every tab in PAGE_NAV is a real page now: PROFILES and ANALYTICS both
         ship. This strip is hardcoded rather than built from site.js so the
         page renders its own chrome before any script runs; it has to be kept
         in step by hand when a tab is added. The query-carrying block at the
         bottom of this file lists the same filenames and must be updated with
         it. -->
    <nav class="svp-nav" aria-label="Site sections">
      <a class="nav-btn" href="index.html">Home</a>
      <a class="nav-btn" href="index.html">Standings</a>
      <span class="nav-btn" aria-current="true">Weekly recap</span>
      <a class="nav-btn" href="managers.html">Profiles</a>
      <a class="nav-btn" href="analytics.html">Analytics</a>
    </nav>
    <!-- Filled from standings.json meta.as_of_week by the script below;
         deliberately empty in the markup so nothing false can render. -->
    <span class="svp-week" id="svp-week"></span>
  </div>
</header>

<main class="svp-page">
  <p class="svp-kicker">The SVP Column</p>

  <!-- "One big thing" is the locked column format — don't change the wording. -->
  <h1 class="svp-headline">One big thing</h1>

  <!-- BYLINE. Hidden until a column is actually on the page: a columnist's
       face over an empty desk is the page claiming an author for prose that
       does not exist. The avatar is resolved through art_slots.json like every
       other picture on the site, and the figure is dropped entirely if the
       slot resolves to nothing or the file 404s — the name and the date stand
       on their own. -->
  <div class="svp-byline" id="svp-byline" hidden>
    <img class="svp-byline-avatar" id="svp-byline-avatar" alt="" width="56" height="56" hidden>
    <div class="svp-byline-text">
      <span class="svp-byline-name">SVP</span>
      <span class="svp-byline-meta" id="svp-byline-meta"></span>
    </div>
  </div>

  <!-- ABSENT STATE. Present in the markup so it renders with no JavaScript at
       all, and removed by the script only once real prose replaces it. -->
  <p class="svp-teaser" id="svp-teaser">The desk is dark until the games start. The first column
  drops after Week&nbsp;0 — until then, the board is the whole story.</p>

  <!-- PRESENT STATE — the newest column. One <p> per paragraph in the week's
       file; the split is done in Python (docs/output-contract.md), not here. -->
  <article class="svp-column" id="svp-column" hidden></article>

  <!-- THE ARCHIVE. Every earlier week, newest first, in the order the manifest
       already put them in — this page does not re-sort a computed ordering.
       Hidden until there is a second column to list: a heading reading "earlier
       this season" over an empty list is the page claiming a back catalogue it
       does not have.

       Each entry opens IN PLACE rather than linking away, and fetches its own
       week file the first time it is opened. That is why the manifest carries
       no prose: a reader who opens one week pays for one week, and the page
       does not download the whole season to draw a list of dates. -->
  <section class="svp-archive" id="svp-archive" hidden>
    <h2 class="svp-archive-head">Earlier this season</h2>
    <ol class="svp-archive-list" id="svp-archive-list"></ol>
  </section>

  <hr class="svp-rule">
  <p class="svp-foot-note">Filed weekly. Standings live on the
    <a href="index.html">board</a>.</p>
</main>

<!-- site.js is definitions only — no top-level side effects — so loading it
     here costs this page nothing and buys resolveArt(), the canonical group
     list and the escaping helper. Copying any of those inline is how a second,
     silently-drifting answer to "which leagues are real" gets created. -->
<script src="site.js"></script>
<script>
  // Presentation only. Five jobs, all fail-soft, and every failure lands on the
  // absent state rather than on a guess:
  //   1. carry ?group= (and ?scoped=1 with it) onto every internal link so the
  //      league selection survives the round trip. Selecting by the bare
  //      filename rather than one hardcoded href means a tab added to the nav
  //      above is covered without touching this.
  //   2. label the masthead with the group's REAL week, read off the committed
  //      standings.json the board itself renders from.
  //   3. render the newest filed column from the archive manifest at
  //      data/<group>/columns/index.json. A 404 is the ordinary state, not an
  //      error, and it leaves the teaser standing.
  //   4. list every earlier week under it, each opening in place and fetching
  //      its own file the first time it is opened.
  //   5. hang the columnist's avatar on the byline, via art_slots.json.
  (function () {
    var q = location.search;
    if (q) {
      ['index.html', 'managers.html', 'analytics.html'].forEach(function (page) {
        document.querySelectorAll('a[href="' + page + '"]').forEach(function (a) {
          a.setAttribute('href', page + q);
        });
      });
    }

    // currentGroupId() returns null for a ?group= that names no real league --
    // an unknown group must not silently render The Panel's column under
    // somebody else's URL, so nothing is fetched at all in that case.
    var group = (typeof currentGroupId === 'function') ? currentGroupId() : null;
    if (!group || !window.fetch) return;

    function getJSON(path) {
      return fetch(path, { cache: 'no-store' }).then(function (r) {
        return r.ok ? r.json() : null;
      }).catch(function () { return null; });
    }

    var COLUMNS = 'data/' + group + '/columns/';

    // The one label rule, used by the masthead, the byline and every archive
    // entry, so the same column cannot be called "Preseason" in the list and
    // "Week 00" at the top. meta.preseason is the packet's flag -- this page
    // does not decide what week 0 means.
    function weekLabel(week, preseason) {
      if (preseason) return 'Preseason';
      if (!Number.isInteger(week)) return 'Live';
      return 'Week ' + (week < 10 ? '0' + week : week);
    }

    // A filed date, or '' when the stamp is missing or is not a date. Never a
    // guess and never today: an undated column is shown undated.
    function filedOn(stamp) {
      var d = String(stamp || '').slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : '';
    }

    function paragraphsOf(doc) {
      var paras = (doc && doc.column && doc.column.paragraphs) || [];
      return Array.isArray(paras) ? paras.filter(function (x) {
        return typeof x === 'string' && x.trim();
      }) : [];
    }

    function proseHTML(paras) {
      return paras.map(function (x) { return '<p>' + esc(String(x)) + '</p>'; }).join('');
    }

    // 2 -- the masthead week. meta.as_of_week is null before the first scored
    // week ("Preseason") and an integer after ("Week N"). Any failure leaves
    // the label empty; an empty label is honest, a guessed one is the thing
    // this page exists to not do. This reads the BOARD's week, not the
    // column's: the two answer different questions and legitimately differ
    // whenever the current week has no column filed for it yet.
    getJSON('data/' + group + '/standings.json').then(function (d) {
      var label = document.getElementById('svp-week');
      if (!label || !d || !d.meta) return;
      var w = d.meta.as_of_week;
      if (w === null || w === undefined) label.textContent = 'Preseason';
      else if (Number.isInteger(w)) label.textContent = weekLabel(w, false);
    });

    // 3 + 4 + 5 -- the archive. art_slots.json is fetched alongside rather than
    // before, because the avatar is decoration on prose: the column must render
    // whether or not the slot manifest is reachable.
    Promise.all([
      getJSON(COLUMNS + 'index.json'),
      getJSON('assets/art_slots.json'),
    ]).then(function (res) {
      var index = res[0];
      var slots = res[1];
      var entries = (index && Array.isArray(index.columns)) ? index.columns : [];
      // No manifest, or a manifest with nothing in it, is the ordinary
      // pre-Week-0 state and is treated exactly as no column at all: the teaser
      // stands and no byline is drawn over it.
      if (!entries.length) return;

      if (slots) ART_SLOTS = slots;
      renderCurrent(entries[0]);
      renderArchive(entries.slice(1));
    });

    // The newest column, in full, in place of the teaser.
    function renderCurrent(entry) {
      getJSON(COLUMNS + entry.file).then(function (doc) {
        var paras = paragraphsOf(doc);
        // A manifest entry whose file is missing or empty must not blank the
        // teaser and leave the desk showing a byline over silence. The archive
        // list below is drawn either way -- the earlier weeks are still real.
        if (!paras.length) return;

        var article = document.getElementById('svp-column');
        var teaser = document.getElementById('svp-teaser');
        if (!article) return;
        article.innerHTML = proseHTML(paras);
        article.hidden = false;
        if (teaser) teaser.hidden = true;

        // The byline's date line: the column's own week, on the same rule the
        // list uses, plus the day it was filed.
        var meta = (doc && doc.meta) || {};
        var bits = [weekLabel(meta.week, meta.preseason === true)];
        var filed = filedOn(meta.generated_at);
        if (filed) bits.push(filed);
        var metaEl = document.getElementById('svp-byline-meta');
        if (metaEl) metaEl.textContent = bits.join(' \u00b7 ');
        var byline = document.getElementById('svp-byline');
        if (byline) byline.hidden = false;

        // The avatar. resolveArt() reads the module-level ART_SLOTS in site.js,
        // so it has to be seeded first; a missing manifest leaves it {} and
        // resolveArt returns null, which is the same graceful-absence path as a
        // group that declares no art. onerror covers the remaining case -- a
        // declared candidate that is not on disk -- by removing the image
        // rather than leaving a broken-image glyph next to the byline.
        var src = (typeof resolveArt === 'function')
          ? resolveArt(group, 'svp_column_art', meta.week) : null;
        if (!src) return;
        var img = document.getElementById('svp-byline-avatar');
        if (!img) return;
        img.onerror = function () { img.remove(); };
        img.alt = 'SVP';
        img.src = src;
        img.hidden = false;
      });
    }

    // Every earlier week. Drawn from the manifest alone -- no prose is fetched
    // until a reader actually opens one.
    function renderArchive(rest) {
      if (!rest.length) return;
      var section = document.getElementById('svp-archive');
      var list = document.getElementById('svp-archive-list');
      if (!section || !list) return;

      list.innerHTML = rest.map(function (entry, i) {
        var bodyId = 'svp-arc-body-' + i;
        var meta = [filedOn(entry.generated_at)];
        if (Number.isInteger(entry.word_count)) meta.push(entry.word_count + ' words');
        return '<li class="svp-arc">' +
          '<button type="button" class="svp-arc-toggle" aria-expanded="false"' +
          ' aria-controls="' + bodyId + '" data-i="' + i + '">' +
            '<span class="svp-arc-week">' +
              esc(weekLabel(entry.week, entry.preseason === true)) + '</span>' +
            '<span class="svp-arc-meta">' +
              esc(meta.filter(Boolean).join(' \u00b7 ')) + '</span>' +
            '<span class="svp-arc-mark" aria-hidden="true"></span>' +
          '</button>' +
          '<div class="svp-arc-body" id="' + bodyId + '" hidden></div>' +
        '</li>';
      }).join('');

      list.querySelectorAll('.svp-arc-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var entry = rest[Number(btn.dataset.i)];
          var body = document.getElementById(btn.getAttribute('aria-controls'));
          if (!entry || !body) return;

          // Close: the state lives on the button, and any prose already fetched
          // stays in the DOM so reopening costs nothing.
          if (btn.getAttribute('aria-expanded') === 'true') {
            btn.setAttribute('aria-expanded', 'false');
            body.hidden = true;
            return;
          }
          btn.setAttribute('aria-expanded', 'true');
          body.hidden = false;
          if (body.dataset.loaded) return;

          body.innerHTML = '<p class="svp-arc-note">Loading\u2026</p>';
          getJSON(COLUMNS + entry.file).then(function (doc) {
            var paras = paragraphsOf(doc);
            // A named file that will not load says so in place. The entry stays
            // open and every other week is unaffected -- one dead file must not
            // take down the archive.
            if (!paras.length) {
              body.innerHTML = '<p class="svp-arc-note">This column could not be ' +
                'loaded. The others are unaffected.</p>';
              return;
            }
            body.dataset.loaded = '1';
            body.innerHTML = proseHTML(paras);
          });
        });
      });

      section.hidden = false;
    }
  })();
</script>

</body>
</html>
