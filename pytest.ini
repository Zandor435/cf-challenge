# Pytest configuration for the CF Challenge test suite.
#
# testpaths pins collection to scripts/ — the only place tests live. Without it
# a bare `pytest` walks the whole repo (docs/, data/, output/, .venv/) looking
# for test files, which is slow and can import things that were never meant to
# be imported.
#
# python_files is the default value, stated explicitly because one file depends
# on it: scripts/selftest_10_1.py is a hand-rolled runner whose inner functions
# are named test_*, and it must stay OUT of the blocking pytest step (see the
# collect_ignore note in conftest.py). Widening this pattern would silently
# import it. conftest.py ignores it belt-and-braces.
[pytest]
testpaths = scripts
python_files = test_*.py
python_functions = test_*
