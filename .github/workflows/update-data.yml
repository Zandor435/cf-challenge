name: Weekly Data Update

on:
  # TWO schedules, deliberately. Consolidated here — this is the only cron in the
  # repo that runs the pipeline, and there is no second workflow.
  #
  # 1. DAILY 13:00 UTC (~9am ET) — the data refresh, unchanged. Most days have no
  #    football, and the rule-7 gate below skips those BEFORE the dependency
  #    install or any API call, so an off-cycle run costs nothing. A daily fire
  #    with a tight window beats a weekly one: Thursday and Friday night games
  #    reach the board the next morning instead of waiting for Sunday.
  #
  # 2. SUNDAYS 08:00, 09:00, 12:00 UTC — the EMAIL windows. Three entries on
  #    purpose, do not collapse them:
  #      08:00 and 09:00 are both 4am ET, on opposite sides of the Nov 1 DST
  #        change — one of the two is always 4am ET, whatever the date.
  #      12:00 is the backstop for Saturday-night games scored late.
  #    Multiple windows are safe because should_send.py refuses a week it has
  #    already emailed (email/state/<group>/last_send.json): the first window to
  #    pass sends, the rest no-op. The gate's own cutoff is 08:00 UTC and is
  #    pinned to the earliest window here — test_should_send.py reads this cron
  #    and fails if the two ever drift apart.
  #
  # These also make Sunday run the data pipeline four times (three here plus the
  # 13:00 daily). That is intended: each is gated, and a Sunday with nothing new
  # costs one checkout.
  #
  # GitHub disables cron on a repo with no pushes for 60 days — if the boards
  # ever go quiet in the off-season, re-enable it before kickoff.
  schedule:
    - cron: "0 13 * * *"        # daily data refresh
    - cron: "0 8,9,12 * * 0"    # Sunday email windows (4am ET either side of DST, + backstop)
  workflow_dispatch: {}  # manual trigger — always bypasses the gate

# This pipeline has NO `on: push` trigger, so nothing it commits can re-trigger
# it. See the recursion note on the commit step.

jobs:
  update:
    runs-on: ubuntu-latest
    # DEPLOY-FROM-INSIDE (playbook rule 9). A commit pushed with GITHUB_TOKEN does
    # NOT trigger `on: push` workflows — so a separate push-triggered Pages deploy
    # never fires on the bot's data commit and the live site drifts stale (we
    # verified this: the site froze ~16 min behind the repo). The fix rule 9
    # mandates is to deploy Pages FROM THIS job, right after it commits the fresh
    # boards. So this job needs: contents:write (commit the data), and pages:write
    # + id-token:write (publish it). No `on: push` on this pipeline, and the deploy
    # runs inline (not a separately-triggered run), so nothing here can recurse.
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Share the single Pages concurrency group with pages.yml so an inline deploy
    # and a human-push deploy can never race the one github-pages environment.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The scripts read the env var CFB_API_KEY. Source it from a repo secret of
      # EITHER name so a secret saved as CFBD_API_KEY also works (|| = first non-empty).
      CFB_API_KEY: ${{ secrets.CFB_API_KEY || secrets.CFBD_API_KEY }}
      # generate_commentary.py resolves the key via utils.load_env_file() then
      # os.environ. load_env_file() uses setdefault (existing env wins) and there
      # is no .env on a runner, so this job-level var is the ONLY channel that
      # reaches it. Job-level rather than step-level to match CFB_API_KEY above.
      # Absent/empty, the generator raises and its own fail-soft guard warns and
      # exits 0 — a missing secret degrades the column, never the standings.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ====== GATE: does this run have any work to do? (playbook rule 7) ======
      # Decides off committed files only — the cache's own schedule plus
      # season.json — so it makes ZERO network calls and runs BEFORE the
      # dependency install. A quiet Tuesday therefore costs one checkout and
      # nothing else: no pip, no CFBD request against the free tier (rule 6),
      # no commit, no deploy.
      #
      # It fails OPEN: an unreadable cache emits run=true plus a ::warning::,
      # never a skip. A gate stuck closed takes the site dark silently, which
      # is precisely what rule 3 exists to prevent.
      #
      # Manual dispatch always forces through, so this can never wedge the
      # pipeline shut.
      - name: Week-window gate
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python scripts/should_run.py $FORCE

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install numpy

      # ====== SHARED: fetch results + SP+ into the one cache (needs-new-data) ======
      # continue-on-error (playbook rule 3): a fetch outage must not take the
      # pipeline dark. fetch_results.py keeps the last good (correct-season) cache
      # untouched and exits non-fatally; the reshape step below runs off it. A
      # keyless/incomplete fetch writes NOTHING (test_fetch_integrity.py).
      #
      # NO --season literal here: fetch_results.py defaults to season.json's
      # cfbd_default_season (utils.get_cfbd_default_season). This is deliberate —
      # season.json is the single source of truth ("no season literal lives in any
      # script"). If we hardcoded a year, a season flip would score the new season
      # against a cache still tagged with the old one and trip the §6 guard
      # (assert_season_matches_cache). Flip season.json only; the fetch follows.
      - name: Fetch game results + SP+
        id: fetch
        if: steps.gate.outputs.run == 'true'
        run: python scripts/fetch_results.py
        continue-on-error: true

      # ====== SURFACE the fetch outcome prominently (do not pass quietly) ======
      # continue-on-error hides the red X, so a degraded run could read as clean.
      # Make it loud: a ::warning:: annotation + a banner in the run Summary.
      - name: Report fetch outcome
        # always() so continue-on-error can't hide a degraded fetch — but
        # still gated, or a skipped day would report a fetch that never ran.
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            echo "### ✅ Fetch OK — scored off a fresh CFBD pull" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Fetch degraded::CFBD fetch did not succeed (outcome=${{ steps.fetch.outcome }}). Scored off the LAST GOOD committed cache; boards may lag live results until the next successful pull. Check the CFB_API_KEY / CFBD_API_KEY secret and CFBD availability."
            {
              echo "### ⚠️ FETCH DEGRADED — ran off the last good cache"
              echo ""
              echo "The CFBD fetch step did not succeed (\`outcome=${{ steps.fetch.outcome }}\`)."
              echo "Scoring ran off the **last committed cache** (architected fallback,"
              echo "playbook rule 3), so the boards may lag live results until the next"
              echo "successful pull."
              echo ""
              echo "**Check:** the repo secret is set — the workflow reads env \`CFB_API_KEY\`,"
              echo "sourced from a secret named \`CFB_API_KEY\` or \`CFBD_API_KEY\` — and that"
              echo "CFBD is reachable."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ====== RESHAPE: validate -> score -> project -> timeline, all groups ======
      # Reshapes-existing-data: runs regardless of the fetch outcome, off the
      # shared cache (degrades gracefully rather than freezing). Board 1 is
      # fatal; the projector degrades. Writes docs/data/<group_id>/.
      - name: Score + project all groups
        if: steps.gate.outputs.run == 'true'
        run: python scripts/run_groups.py --group all

      # ====== COMMENTARY: the one pundit (ARCHITECTURE §8, §12) ======
      # Reshapes-existing-data, the same class as scoring above: the packet is
      # built from the boards run_groups.py just wrote, NOT from the fetch. So
      # these gate on steps.gate.outputs.run ALONE and deliberately not on
      # steps.fetch.outcome — a degraded fetch still scored off the last good
      # cache, the column still has real numbers to write about, and freezing the
      # narrative because CFBD blinked is the exact failure rule 3 forbids.
      #
      # The group list comes from utils.get_all_group_ids() rather than a literal,
      # so adding a group under groups/ needs no edit here (same single-source
      # reasoning as season.json on the fetch step).
      - name: Build week packets
        id: packet
        if: steps.gate.outputs.run == 'true'
        # build_week_packet.py is NOT fail-soft — it exits non-zero on missing or
        # malformed input. continue-on-error keeps that off the critical path.
        # The per-group loop then keeps ONE bad group from silencing the other
        # three: a failure is warned about and skipped, and `built` carries only
        # the groups that actually produced a packet.
        continue-on-error: true
        run: |
          groups=$(python -c "import sys; sys.path.insert(0, 'scripts'); import utils; print(' '.join(utils.get_all_group_ids()))")
          built=""
          for g in $groups; do
            if python scripts/build_week_packet.py --group "$g"; then
              built="$built $g"
            else
              echo "::warning title=Week packet failed::[$g] build_week_packet.py exited non-zero; this group gets no column this run. Standings are unaffected (rule 3)."
            fi
          done
          echo "built=$(echo $built | xargs)" >> "$GITHUB_OUTPUT"

      - name: Write the SVP column
        # Conditioned on the packet step's OWN output, so the generator can never
        # run against a packet that was never built: `built` lists only the groups
        # whose build exited 0, and an empty string skips the step outright —
        # including the case where the packet step died before writing the output
        # at all. week_packet.json is gitignored, so it never arrives via
        # checkout: a packet on the runner was built by THIS run, never a stale
        # one left behind.
        #
        # No continue-on-error, deliberately. generate_commentary.py is already
        # internally fail-soft in live mode — any failure (no key, dead API,
        # malformed response) logs a ::warning:: and returns 0, writing nothing
        # and leaving the prior column and column_memory.json intact.
        if: steps.gate.outputs.run == 'true' && steps.packet.outputs.built != ''
        env:
          BUILT: ${{ steps.packet.outputs.built }}
        run: |
          for g in $BUILT; do
            python scripts/generate_commentary.py --group "$g"
          done

      # ====== EMAIL: build the payload (panel pilot) ======
      # continue-on-error (rule 3): a malformed payload must NEVER block the data
      # commit below. The boards reaching the site matters more than any one email.
      # Runs after the column is written, so the payload wraps THIS run's column.
      #
      # PANEL ONLY for the pilot. Adding a group is one line here plus flipping
      # its email_enabled — deliberately not a loop over all groups yet.
      - name: Build email payload
        id: payload
        # EMAIL_WINDOW: the Sunday cron entries, or a manual dispatch. The daily
        # 13:00 data refresh deliberately does NOT reach the email steps — without
        # this, a Week N column filed on a Tuesday would email on Tuesday, and
        # "Sundays only" would hold for the cron but not for the behaviour.
        # Expressed here in YAML rather than as a sixth condition in
        # should_send.py, so the gate's five conditions stay exactly as specified.
        if: >-
          steps.gate.outputs.run == 'true' &&
          (github.event.schedule == '0 8,9,12 * * 0' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: python scripts/build_email_payload.py --group panel

      # ====== EMAIL: the send gate — ONE place decides ======
      # should_send.py checks all five conditions (enabled, payload present, week
      # newer than the last send, at/after 08:00 UTC, recipients resolve
      # completely) and every later step keys off this single output. That is what
      # keeps the three Sunday cron windows from sending three emails: the first
      # one to pass writes state, the rest read it and refuse.
      #
      # RECIPIENTS_JSON is needed HERE, not just at send time: condition 5
      # resolves the roster so an incomplete list fails the gate rather than
      # surfacing as a partial send.
      - name: Email send gate
        id: sendgate
        # Same EMAIL_WINDOW condition as the payload step above. If this step is
        # skipped, steps.sendgate.outputs.send is empty and every later email step
        # sees != 'true' — so a skipped window can never send.
        if: >-
          steps.gate.outputs.run == 'true' &&
          (github.event.schedule == '0 8,9,12 * * 0' || github.event_name == 'workflow_dispatch')
        env:
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
        run: |
          if python scripts/should_send.py --group panel; then
            echo "send=true"  >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      # ====== COMMIT the fresh boards to the repo (history + raw files) ======
      # No [skip ci]: a commit pushed with GITHUB_TOKEN can't trigger a workflow
      # anyway (rule 9), so [skip ci] would buy nothing and only obscure intent.
      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "CFB Fantasy Bot"
          git config user.email "bot@cfb-fantasy.local"
          # Scope is deliberate — the bot commits only pipeline outputs, never untracked working files.
          # SP+ archiving HAS landed: fetch_results.py writes an append-only vintage
          # snapshot to data/ratings_archive/<season>/<date>.json every good pull.
          # It is staged here because anything left unstaged dies with the runner.
          git add data/cfbd_cache.json docs/data
          # Guarded: a degraded run writes no snapshot, and an unmatched pathspec
          # is fatal — that would take the cache and boards down with it (rule 3).
          if [ -d data/ratings_archive ]; then
            git add data/ratings_archive/
          fi
          # Commentary, accumulate side of rule 5: the filed columns and
          # column_memory.json are season-long continuity the pundit reads back
          # next week — the memory file is what stops the column repeating
          # itself. They are written on the runner and die with it unless staged
          # here. week_packet.json and the prompt preview are the regenerate side
          # and stay ignored (.gitignore lines 44-45), so this stages the columns
          # and the memory only.
          #
          # Looped, not globbed: an unexpanded `groups/*/output/` would reach git
          # as a literal pathspec and abort the whole commit, taking the cache and
          # the boards down with it — the same trap the guard above exists for.
          for d in groups/*/output/; do
            [ -d "$d" ] || continue
            git add "$d"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update: $(date +%Y-%m-%d) weekly data refresh"
            # Rebase onto anything pushed since checkout (another cron window, or a
            # human push) so this can't be rejected as a non-fast-forward. Sunday
            # now fires four times, so concurrent-ish runs are no longer theoretical.
            git pull --rebase origin main
            git push
          fi

      # ====== DEPLOY Pages FROM INSIDE this job (rule 9) ======
      # Publish the docs/ we just regenerated so the live site serves FRESH
      # numbers. This runs inline within the pipeline run — it is NOT a separately
      # push-triggered workflow, so it cannot re-trigger the pipeline (which has no
      # `on: push`). Gated on scoring having succeeded (that step is fatal, so
      # reaching here means Board 1 wrote). Shares the `pages` concurrency group
      # with pages.yml (which handles human docs/ pushes) so the two never race.
      - name: Configure Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v6
      - name: Upload docs/ artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v5

      # ====== EMAIL: send (panel pilot) ======
      # Fires only when the single gate above said so. Deliberately AFTER the data
      # commit and the Pages deploy: the site the email's CTA points at should be
      # serving this week's boards before the email lands, not minutes later.
      #
      # continue-on-error (rule 3): a Resend hiccup must not fail the run or block
      # the state commit below. The send either happened or it did not; the next
      # cron window will retry it because no state was written.
      #
      # BOTH secrets are needed: RESEND_API_KEY to send, RECIPIENTS_JSON to resolve
      # the roster (the public group config carries no addresses).
      - name: Send email
        id: send
        if: steps.sendgate.outputs.send == 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
        run: python scripts/send_email.py --group panel

      # ====== EMAIL: commit the send state ======
      # AFTER the send. send_email.py writes email/state/<group>/last_send.json
      # ONLY on a confirmed send, so committing it here is what makes the next
      # cron window (09:00, 12:00) refuse the repeat week. Without this commit the
      # state dies with the runner and Sunday sends three emails.
      #
      # Staged by explicit path — the file holds a recipient COUNT, never the
      # addresses. Guarded with -e because on a run where the send failed, the
      # file does not exist and a bare `git add` on a missing pathspec exits 128
      # and kills the push.
      - name: Commit email state
        if: steps.sendgate.outputs.send == 'true'
        run: |
          git config user.name "CFB Fantasy Bot"
          git config user.email "bot@cfb-fantasy.local"
          for p in email/state/panel/last_send.json; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "No email state change (send did not complete)."
          else
            git commit -m "Email state: panel week sent ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
          fi
