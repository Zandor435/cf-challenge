name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # secondary trigger, for manual confirmation runs

# Read-only. This workflow only runs the test suite — it never commits or
# deploys, unlike pages.yml (pages:write) and update-data.yml (contents:write
# + pages:write). No secrets are required by anything below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # Each script below is a hand-rolled runner (check()/main() + an
      # explicit sys.exit(0/1)), NOT a pytest test_*() module — bare
      # `pytest scripts/` would import these files but collect ZERO test
      # items from six of the seven, silently skipping almost the whole
      # suite while still exiting 0. Run each directly so every check in
      # every file actually executes and a real failure actually fails this
      # job (a silent miss is worse than a loud stop).
      - name: test_resolver.py
        run: python scripts/test_resolver.py
      - name: test_cache_access.py
        run: python scripts/test_cache_access.py
      - name: test_pick_rules.py
        run: python scripts/test_pick_rules.py
      # Draft entry (scripts/enter_draft.py). Hand-rolled like its neighbours,
      # so the supplementary pytest step below collects ZERO items from it --
      # it was passing locally and running nowhere until this line existed.
      - name: test_enter_draft.py
        run: python scripts/test_enter_draft.py
      - name: test_output_shape.py
        run: python scripts/test_output_shape.py
      - name: test_projector_correlation.py
        run: python scripts/test_projector_correlation.py
      # Head-to-head coupling (ARCHITECTURE §3). Silent when wrong in the worst
      # way: an uncoupled pair produces trials where BOTH teams won the same
      # game, which no assertion elsewhere would catch and which leaks straight
      # into p_win_pool. The four real groups carry 5/10/17/28 such games, so
      # this runs against committed picks, not only a synthetic fixture.
      - name: test_projector_h2h.py
        run: python scripts/test_projector_h2h.py
      - name: test_fetch_integrity.py
        run: python scripts/test_fetch_integrity.py

      # The frozen preseason baseline (ARCHITECTURE section 7). Write-once and
      # UNREPEATABLE: preseason SP+ vanished the moment the first 2026 game went
      # final, because CFBD's /ratings/sp only ever returns the CURRENT rating
      # for a season. So the guards that stop it being written wrong are the only
      # protection there is, and they are tested here rather than trusted. The
      # checks are deliberately durable past kickoff -- guards and projector
      # reuse run on in-memory fixtures, schedule length uses games_scheduled
      # (which counts played and unplayed alike), and the sane-range checks read
      # the committed artifact instead of recomputing it.
      - name: test_preseason_baseline.py
        run: python scripts/test_preseason_baseline.py
      # The scheduled pipeline's run gate. Both directions are silent when
      # wrong — stuck open burns the free-tier budget, stuck closed freezes the
      # site while every run still shows green — so it is tested here rather
      # than discovered in production.
      - name: test_should_run.py
        run: python scripts/test_should_run.py

      # Commentary layer (ARCHITECTURE §8/§12). Both are offline: the packet
      # test reshapes the committed boards, and the prompt test is dry-run only
      # — no OPENAI_API_KEY is read and no network call is made, so these are
      # safe in the read-only, secret-free job above. They are BLOCKING despite
      # commentary being fail-soft at runtime: fail-soft means a dead API can't
      # take down the pipeline, not that a broken packet should reach the
      # pundit. A wrong number here is quoted verbatim into the column as fact.
      - name: test_week_packet.py
        run: python scripts/test_week_packet.py
      - name: test_commentary_prompt.py
        run: python scripts/test_commentary_prompt.py

      # ARCHITECTURE §9: the fetch->score name/conference/draft-rule gate,
      # run here against whatever picks are currently committed (the real
      # groups' dummy picks today; real drafts once they land) so a bad
      # picks.json fails CI loudly instead of only failing at the next live
      # pipeline run.
      - name: validate_team_names.py (§9 gate)
        run: python scripts/validate_team_names.py

      # docs/ is the Pages web root and groups/ is NOT served, so the persona
      # prose the profile page renders exists as a DERIVED copy under
      # docs/data/<group>/personas.json (same pattern build_canonical.py uses
      # for teams_canonical.json). A copy is only safe if staleness is loud:
      # --check regenerates the payload from groups/<group>/personas.json in
      # memory and diffs it against what is committed, so editing the source
      # without re-running the script fails CI instead of silently shipping
      # yesterday's prose. It also runs the config<->personas reconciliation
      # (§9-style gate): a manager_id present on one side and missing on the
      # other fails here and NAMES the offender.
      - name: sync_personas.py --check (docs/ copy is current)
        run: python scripts/sync_personas.py --check

      # Supplementary, not a replacement for the explicit runs above: catches
      # the two genuinely pytest-style tests inside test_projector_correlation.py
      # (test_realistic_partial_overlap, test_degenerate_opposite_single_team)
      # plus anything pytest-style added going forward.
      - name: pytest (supplementary discovery)
        run: python -m pytest scripts/ -v

      # LAST, and the ONLY non-blocking step. selftest_10_1 exercises the
      # commentary-bypass path via `fetch_results.py --simulate-failure`, which
      # trips the 10-day cache-staleness ceiling and exits 4 once the committed
      # cache ages past it — a real external dependency (needs a live CFBD
      # fetch), not a code defect, and it worsens every day the feed is idle.
      # It used to run mid-job with fail-fast, so that one aging clock aborted
      # the run before the §9 gate above ever executed — the check that actually
      # protects pick data got zero coverage on every push. Ordered last so a
      # stale cache can no longer mask a genuine failure, and continue-on-error
      # so its known failure doesn't redden an otherwise-green suite. NOTE: the
      # step is still reported in the run summary — read it, don't ignore it;
      # the other 22 checks in this file are real and a NEW failure here is a
      # real regression.
      - name: selftest_10_1.py (non-blocking — see comment)
        continue-on-error: true
        run: python scripts/selftest_10_1.py
