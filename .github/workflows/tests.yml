name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # secondary trigger, for manual confirmation runs

# Read-only. This workflow only runs the test suite — it never commits or
# deploys, unlike pages.yml (pages:write) and update-data.yml (contents:write
# + pages:write). No secrets are required by anything below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # THE suite. This used to be a "supplementary discovery" step behind
      # fifteen explicit `python scripts/test_x.py` runs, because every one of
      # those files was a hand-rolled runner (check()/main() + sys.exit) and
      # bare `pytest scripts/` collected ZERO items from twelve of the fourteen
      # — and the eight items it DID collect could not fail, because check()
      # records a result, it does not raise. Naming each file was the only way
      # to be sure it ran.
      #
      # Both halves of that are fixed. Every file now exposes its sections as
      # test_* functions, and conftest.py gates each one on the module's check
      # ledger, so a recorded FAIL is a pytest failure naming the check. 91
      # items, ~600 checks, one step.
      #
      # The explicit steps are gone because they are now strictly redundant, and
      # they failed silently in the one direction that actually happens: a new
      # test file added without someone remembering to add a step here never ran
      # and nothing said so. scripts/test_suite_collection.py is the replacement
      # guard — it fails if any scripts/test_*.py stops contributing collectable,
      # non-vacuous tests, which is the invariant the wall of steps was
      # approximating by hand.
      - name: pytest (whole suite)
        run: python -m pytest -v

      # ARCHITECTURE §9: the fetch->score name/conference/draft-rule gate,
      # run here against whatever picks are currently committed (the real
      # groups' dummy picks today; real drafts once they land) so a bad
      # picks.json fails CI loudly instead of only failing at the next live
      # pipeline run. NOT a pytest module — it is the production gate script
      # itself, so it keeps its own step.
      - name: validate_team_names.py (§9 gate)
        run: python scripts/validate_team_names.py

      # docs/ is the Pages web root and groups/ is NOT served, so the persona
      # prose the profile page renders exists as a DERIVED copy under
      # docs/data/<group>/personas.json (same pattern build_canonical.py uses
      # for teams_canonical.json). A copy is only safe if staleness is loud:
      # --check regenerates the payload from groups/<group>/personas.json in
      # memory and diffs it against what is committed, so editing the source
      # without re-running the script fails CI instead of silently shipping
      # yesterday's prose. It also runs the config<->personas reconciliation
      # (§9-style gate): a manager_id present on one side and missing on the
      # other fails here and NAMES the offender. Also a production script, not
      # a test module, so it also keeps its own step.
      - name: sync_personas.py --check (docs/ copy is current)
        run: python scripts/sync_personas.py --check

      # Same posture, same reason, for the render-ready team identity map the
      # profile picks table reads. It is derived from data/teams_canonical.json
      # (mark, primary colour, and the black-or-white type colour that is
      # readable on that primary), so a canonical spine that gains a team or
      # changes a colour without this being regenerated ships a picks table
      # with a stale or missing chip. --check regenerates in memory and diffs.
      - name: build_team_marks.py --check (docs/ copy is current)
        run: python scripts/build_team_marks.py --check

      # THE FACTUAL GUARD, over the columns that are actually published. It
      # answers one question -- does any filed column assert a number or a
      # class of claim the week packet cannot support -- and a violation fails
      # the build. scripts/column_guard.py carries the rules; --check-published
      # runs them over docs/data/<group>/columns/week_<N>.json.
      #
      # WHY IT REBUILDS THE PACKET FIRST. The guard needs the packet, because
      # the whole design is traceability against the packet's own fields rather
      # than a keyword blocklist -- "eight top-25 opponents" is CORRECT when
      # strength_of_schedule.opponents_sp_top25 is 8, and a check that cannot
      # see that field would fail a true sentence. Packets are engine
      # intermediates and are gitignored, so they are not in the checkout.
      #
      # Rebuilding them here is offline and deterministic, which is the only
      # reason this is sound: --week0-packet reads only committed inputs
      # (data/cfbd_cache.json, the frozen baseline, the win-total reference,
      # groups/*/), makes NO network call, and the pool simulation is seeded
      # per group and week (projector.POOL_SIM_SEED_BASE), so the regenerated
      # packet is byte-identical to the one the column was written against --
      # verified locally, minus generated_at. Nothing here is fetched and no
      # API key is needed, which is why it belongs in this read-only job.
      #
      # SIDE EFFECT, PUT TO WORK. --week0-packet also rewrites
      # docs/data/<group>/columns/rail.json through build_rail, and rail.json
      # IS committed (unlike the packets). So the regenerated tree is a free
      # staleness check on it -- see the diff step below.
      #
      # The group list comes off groups/ rather than being spelled out, so a
      # new league is covered without editing this file. A group with no
      # published column reports that and passes -- absent is an ordinary
      # state here, exactly as it is everywhere else in this pipeline.
      - name: column_guard --check-published (no column asserts what the packet lacks)
        run: |
          python scripts/preseason_baseline.py --week0-packet all
          for d in groups/*/; do
            g=$(basename "$d")
            python scripts/generate_commentary.py --group "$g"               --packet "output/$g/week_0_packet.json" --check-published
          done

      # THE RAIL IS COMMITTED; THE PACKET IT COMES FROM IS NOT. rail.json is
      # the only published artifact build_rail writes, and the step above has
      # just regenerated all four of them for free as a side effect of the
      # packet rebuild. So the tree right now holds "what build_rail would
      # write today" sitting on top of "what somebody committed", and diffing
      # the two costs nothing and catches the one failure this file has no
      # other guard against: a builder change (or a hand edit) that never got
      # re-published, leaving the site serving a card the code no longer
      # produces. sync_personas.py --check and build_team_marks.py --check
      # already do exactly this for their own derived copies; this closes the
      # third one.
      #
      # generated_at is EXCLUDED, not normalized. It is a wall-clock timestamp
      # written at build time, so it differs on every single run and would make
      # this check red always. Excluded via git's own -I rather than by
      # rewriting the files first, for two reasons: rewriting would mutate the
      # tree the guard step just produced (and any bug in the rewriter would
      # read as a passing check), and -I is evaluated PER HUNK -- a hunk is
      # ignored only when EVERY changed line in it matches, so a real value
      # that changed alongside the timestamp still fails. Nothing here can hide
      # a substantive diff.
      #
      # COMMITS NOTHING. It reads the working tree against HEAD and stops. The
      # `git add` you might reach for on a red run belongs on your machine:
      # re-run the builder locally and commit the result.
      #
      # `git diff` cannot see a rail.json that is NEW, so the untracked check
      # is the second half of the same question -- a group that starts carrying
      # a rail is just as unpublished as one whose rail went stale. A rail that
      # build_rail DELETES does show up as a deletion in the diff.
      - name: rail.json is published (regenerated == committed)
        run: |
          git diff --exit-code -I'"generated_at"' -- 'docs/data/*/columns/rail.json' || {
            echo "::error::A committed rail.json does not match what build_rail.py"
            echo "::error::produces from the packet. Re-run"
            echo "::error::  python scripts/preseason_baseline.py --week0-packet all"
            echo "::error::and commit the regenerated docs/data/*/columns/rail.json."
            exit 1
          }
          new=$(git ls-files --others --exclude-standard -- 'docs/data/*/columns/rail.json')
          if [ -n "$new" ]; then
            echo "::error::build_rail.py produced a rail.json that is not committed:"
            echo "$new"
            exit 1
          fi
          echo "rail.json is current for every group."

      # LAST, and blocking like everything above it. selftest_10_1 is a health
      # check of the COMMITTED cache plus the commentary-bypass and season-guard
      # paths — all offline: `fetch_results.py --simulate-failure` raises before
      # any client is built. It used to carry continue-on-error because two
      # facts about a live cache turned it red through no fault of the code:
      # the 10-day staleness ceiling (exit 4 once the cache aged past it) and,
      # on a pre-season cache, a schedule census CFBD cannot satisfy until it
      # posts the conference title games (the 2026 cache on 2026-08-21 held
      # none). A red CI is told to ignore is a red nobody reads, so both are
      # handled in the script now: the census SKIPS with its reason printed
      # until the title games land, and the bypass test asserts whichever
      # documented branch the cache is in (fresh → exit 0 + ::warning::, stale
      # → exit 4 naming the ceiling). Everything it reports is a real
      # assertion, so a failure here is a real regression and fails the job.
      # Still ordered last so the §9 gate above always gets its turn first.
      #
      # DELIBERATELY NOT CONVERTED, and deliberately not collected. Its inner
      # functions are already named test_cache / test_resolver / test_failure_path
      # / test_season_guard, so the only thing keeping it out of `pytest` is that
      # the FILE is not named test_*.py — conftest.py collect_ignores it too, and
      # test_suite_collection.py pins the filename. It reads the LIVE cache (the
      # unit suite pins the frozen 2025 contract fixture) and shells out to
      # fetch_results.py twice, which is a different kind of check and is kept
      # visibly separate on purpose.
      - name: selftest_10_1.py (cache health + bypass/season-guard paths)
        run: python scripts/selftest_10_1.py
